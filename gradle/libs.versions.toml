[versions]
agp                         = "8.6.0"
gson                        = "2.11.0"
kotlin                      = "2.0.21"
ksp                         = "2.0.21-1.0.28"
composeBom                  = "2024.09.00"
coreKtx                     = "1.13.1"
lifecycleRuntimeKtx         = "2.8.5"
activityCompose             = "1.9.2"
navigationCompose           = "2.8.0"
hilt                        = "2.52"
hiltNavigationCompose       = "1.2.0"
room                        = "2.6.1"
firebaseBom                 = "33.3.0"
googleServices              = "4.4.2"
coroutines                  = "1.8.1"
coil                        = "2.7.0"
junit                       = "4.13.2"
credentials                 = "1.3.0"
googleId                    = "1.1.1"
androidxTestExtJunit        = "1.2.1"
espressoCore                = "3.6.1"

[libraries]
# Compose
compose-bom                         = { group = "androidx.compose",        name = "compose-bom",                  version.ref = "composeBom" }
compose-ui                          = { group = "androidx.compose.ui",     name = "ui" }
compose-ui-graphics                 = { group = "androidx.compose.ui",     name = "ui-graphics" }
compose-ui-tooling-preview          = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
compose-material3                   = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended     = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-tooling                  = { group = "androidx.compose.ui",     name = "ui-tooling" }
compose-ui-test-manifest            = { group = "androidx.compose.ui",     name = "ui-test-manifest" }
compose-ui-test-junit4              = { group = "androidx.compose.ui",     name = "ui-test-junit4" }

# AndroidX
androidx-core-ktx                   = { group = "androidx.core",           name = "core-ktx",                     version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx      = { group = "androidx.lifecycle",      name = "lifecycle-runtime-ktx",        version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose           = { group = "androidx.activity",       name = "activity-compose",             version.ref = "activityCompose" }

# Navigation
navigation-compose                  = { group = "androidx.navigation",     name = "navigation-compose",           version.ref = "navigationCompose" }

# Hilt
hilt-android                        = { group = "com.google.dagger",       name = "hilt-android",                 version.ref = "hilt" }
hilt-compiler                       = { group = "com.google.dagger",       name = "hilt-compiler",                version.ref = "hilt" }
hilt-navigation-compose             = { group = "androidx.hilt",           name = "hilt-navigation-compose",      version.ref = "hiltNavigationCompose" }

# Room
room-runtime                        = { group = "androidx.room",           name = "room-runtime",                 version.ref = "room" }
room-ktx                            = { group = "androidx.room",           name = "room-ktx",                     version.ref = "room" }
room-compiler                       = { group = "androidx.room",           name = "room-compiler",                version.ref = "room" }

# Firebase
firebase-bom                        = { group = "com.google.firebase",     name = "firebase-bom",                 version.ref = "firebaseBom" }
firebase-firestore-ktx              = { group = "com.google.firebase",     name = "firebase-firestore-ktx" }
firebase-auth-ktx                   = { group = "com.google.firebase",     name = "firebase-auth-ktx" }
firebase-storage-ktx                = { group = "com.google.firebase",     name = "firebase-storage-ktx" }
androidx-credentials                 = { group = "androidx.credentials",   name = "credentials",                  version.ref = "credentials" }
androidx-credentials-play-services   = { group = "androidx.credentials",   name = "credentials-play-services-auth", version.ref = "credentials" }
googleid                             = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }

# Coroutines
kotlinx-coroutines-android          = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-android",   version.ref = "coroutines" }
kotlinx-coroutines-play-services    = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Coil
coil-compose                        = { group = "io.coil-kt",              name = "coil-compose",                 version.ref = "coil" }

# Gson (Room TypeConverter list serialisation)
gson                                = { group = "com.google.code.gson",    name = "gson",                         version.ref = "gson" }

# Testing
junit                               = { group = "junit",                   name = "junit",                        version.ref = "junit" }
androidx-test-ext-junit             = { group = "androidx.test.ext",       name = "junit",                        version.ref = "androidxTestExtJunit" }
androidx-espresso-core              = { group = "androidx.test.espresso",  name = "espresso-core",                version.ref = "espressoCore" }

[plugins]
android-application     = { id = "com.android.application",            version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                     = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
hilt                    = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
google-services         = { id = "com.google.gms.google-services",      version.ref = "googleServices" }
