# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *override* IDE-specified settings.
# For more details on how to configure your build environment visit:
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError

# When configured, Gradle will run in parallel if possible.
org.gradle.parallel=true

# Enables caching of build outputs across builds
org.gradle.caching=true

# Enables Gradle daemon
org.gradle.daemon=true

# Kotlin daemon memory options
kotlin.daemon.jvm.options=-Xmx2048m

# AndroidX configuration
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=35
android.aarMetadata.check=false
kotlin.suppressKotlinVersionCompatibility=true

# Disable KSP incremental caching
ksp.incremental=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
